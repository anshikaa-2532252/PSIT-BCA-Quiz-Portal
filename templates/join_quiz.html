{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden fade-in-up mt-4">
    <div class="gradient-brand text-white text-center py-6">
        <h2 class="text-2xl font-bold">🔑 Join a Quiz</h2>
        <p class="text-yellow-100 text-sm">Enter the code shared by your teacher</p>
    </div>
    <div class="p-8">
        <form method="POST">
            <div class="mb-4">
                <label for="share_code" class="block text-gray-700 text-sm font-bold mb-2">Quiz Code</label>
                <input type="text" id="share_code" name="share_code" required autocomplete="off"
                       class="shadow-sm appearance-none border rounded-lg w-full py-3 px-3 text-gray-700 text-center text-lg tracking-widest font-mono focus:outline-none focus:ring-2 focus:ring-[#a3243a]">
            </div>
            <button type="submit"
                    class="w-full gradient-brand text-white font-bold py-3 rounded-lg hover:opacity-90 transition shadow">
                Join Quiz
            </button>
        </form>
    </div>
</div>
{% endblock %}
