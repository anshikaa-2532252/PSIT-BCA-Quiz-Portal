{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-xl overflow-hidden fade-in-up mt-4">
    <div class="gradient-brand text-white text-center py-6">
        <h2 class="text-2xl font-bold">Welcome Back</h2>
        <p class="text-yellow-100 text-sm">Login to the PSIT BCA Quiz Portal</p>
    </div>
    <div class="p-8">
        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-700 text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" name="username" required
                       class="shadow-sm appearance-none border rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#a3243a]">
            </div>
            <div>
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" required
                       class="shadow-sm appearance-none border rounded-lg w-full py-2.5 px-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#a3243a]">
            </div>
            <button type="submit"
                    class="w-full gradient-brand text-white font-bold py-3 rounded-lg hover:opacity-90 transition shadow">
                Sign In
            </button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            New here? <a href="{{ url_for('signup') }}" class="text-[#a3243a] font-semibold hover:underline">Create an account</a>
        </p>
        <div class="mt-6 bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-xs text-gray-600">
            <p class="font-semibold text-gray-700 mb-1">Demo faculty login</p>
            <p>Username: <code class="font-mono">bca_teacher</code> &nbsp; Password: <code class="font-mono">bca123</code></p>
        </div>
    </div>
</div>
{% endblock %}
